<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#351c3b">
  <meta name="description" content="Bardfall: famous lines from Shakespeare's plays drifting down the screen. Select a verse to see its play, act and scene.">
  <link rel="canonical" href="https://bardfall.pages.dev/">
  <title>Bardfall — Shakespeare's verses, forever falling.</title>

  <!-- Sharing preview (WhatsApp, social networks) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bardfall">
  <meta property="og:title" content="Bardfall">
  <meta property="og:description" content="Shakespeare's verses, forever falling.">
  <meta property="og:url" content="https://bardfall.pages.dev/">
  <meta property="og:image" content="https://bardfall.pages.dev/favicon.png">
  <meta name="twitter:card" content="summary">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img class="brand-mark" src="favicon.png" alt="" aria-hidden="true">
    <h1>Bardfall</h1>
    <p>Shakespeare's verses, forever falling.</p>
    <div class="ornament">✦ ❧ ✦</div>
  </header>

  <canvas id="stage" aria-label="Falling Shakespeare quotations. Select a quotation to read its source."></canvas>
  <noscript><p class="hint">This page needs JavaScript to show the falling verses.</p></noscript>

  <div class="hint">SELECT A FALLING VERSE TO DISCOVER ITS STORY</div>

  <div class="controls" role="group" aria-label="Playback controls">
    <button id="pauseBtn" type="button" aria-pressed="false">Pause</button>

    <div class="control-group" role="group" aria-label="Verse size">
      <span class="control-label"><span class="label-full">Size</span><span class="label-short">Aa</span></span>
      <button id="sizeDown" class="step-btn" type="button" aria-label="Smaller verses">−</button>
      <button id="sizeUp" class="step-btn" type="button" aria-label="Larger verses">+</button>
    </div>

    <div class="control-group" role="group" aria-label="Falling speed">
      <span class="control-label"><span class="label-full">Speed</span><span class="label-short">»</span></span>
      <button id="speedDown" class="step-btn" type="button" aria-label="Slower">−</button>
      <button id="speedUp" class="step-btn" type="button" aria-label="Faster">+</button>
    </div>
  </div>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="quoteText">
    <div class="modal-card" tabindex="-1">
      <div class="modal-ornament">❧ ✦ ❧</div>
      <p class="modal-quote" id="quoteText"></p>
      <div class="modal-meta">
        <span class="modal-character" id="quoteCharacter"></span>
        <span class="modal-play" id="quoteSource"></span>
      </div>
      <div class="close-hint">TAP OR CLICK TO RETURN</div>
    </div>
  </div>

  <script src="quotes.js"></script>
  <script src="script.js"></script>
</body>
</html>
